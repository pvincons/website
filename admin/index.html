<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PV INCONS - Admin Portal Studio Multi-Module</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Inter & Lucide Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #13151b; }
    ::-webkit-scrollbar-thumb { background: #2a2e39; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #3b4050; }
  </style>
</head>
<body class="bg-[#0f1117] text-gray-200 h-screen overflow-hidden text-sm select-none">

  <!-- MAIN WORKSPACE -->
  <div id="admin-workspace" class="h-full flex flex-col">
    
    <!-- TOP NAVBAR -->
    <header class="h-12 border-b border-[#222630] bg-[#14171f] px-4 flex items-center justify-between shrink-0">
      <div class="flex items-center gap-3">
        <div class="w-6 h-6 rounded bg-rose-600 flex items-center justify-center font-bold text-white text-xs">PV</div>
        <span class="font-semibold text-gray-100">PV INCONS Studio</span>
        <span class="text-xs bg-[#222630] text-gray-400 px-2 py-0.5 rounded">v3.40.0</span>
        <span class="text-gray-600">/</span>
        <span id="active-module-badge" class="text-xs text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20 font-mono">
          posts-news.json Active
        </span>
      </div>

      <!-- ĐỌC FILE JSON CÓ SẴN -->
      <div class="flex items-center gap-2">
        <label for="file-input" class="cursor-pointer bg-[#222630] hover:bg-[#2a2e3d] text-gray-300 text-xs px-3 py-1.5 rounded transition font-medium flex items-center gap-1.5">
          <i data-lucide="upload-cloud" class="w-3.5 h-3.5 text-blue-400"></i>
          <span>Nạp JSON vào Tab này</span>
        </label>
        <input type="file" id="file-input" accept=".json" class="hidden">
      </div>
    </header>

    <!-- MAIN CONTENT (3 CỘT) -->
    <div class="flex flex-1 overflow-hidden">

      <!-- CỘT 1: TAB CHA & DANH SÁCH BÀI VIẾT THEO TAB -->
      <aside class="w-72 border-r border-[#222630] bg-[#12141c] flex flex-col shrink-0">
        
        <!-- SECTION 1: CÁC TAB CHA -->
        <div class="p-3 border-b border-[#222630]">
          <div class="text-[11px] font-semibold text-gray-500 uppercase tracking-wider mb-2">Danh mục hệ thống</div>
          <nav class="space-y-1" id="sidebar-nav">
            
            <a href="#" data-folder="news" data-title="Tin tức" class="nav-tab active flex items-center justify-between px-3 py-2 rounded-lg bg-rose-600/10 text-rose-400 font-medium border border-rose-500/20 transition">
              <div class="flex items-center gap-2.5">
                <i data-lucide="newspaper" class="w-4 h-4 text-rose-500"></i>
                <span>Tin tức</span>
              </div>
              <span class="text-[10px] bg-rose-500/20 text-rose-300 px-1.5 py-0.2 rounded font-mono tab-count" id="count-news">0</span>
            </a>

            <a href="#" data-folder="projects" data-title="Dự án" class="nav-tab flex items-center justify-between px-3 py-2 rounded-lg text-gray-400 hover:bg-[#1a1d26] hover:text-gray-200 transition">
              <div class="flex items-center gap-2.5">
                <i data-lucide="folder-kanban" class="w-4 h-4"></i>
                <span>Dự án</span>
              </div>
              <span class="text-[10px] bg-gray-800 text-gray-400 px-1.5 py-0.2 rounded font-mono tab-count" id="count-projects">0</span>
            </a>

            <a href="#" data-folder="services" data-title="Dịch vụ" class="nav-tab flex items-center justify-between px-3 py-2 rounded-lg text-gray-400 hover:bg-[#1a1d26] hover:text-gray-200 transition">
              <div class="flex items-center gap-2.5">
                <i data-lucide="layers" class="w-4 h-4"></i>
                <span>Dịch vụ</span>
              </div>
              <span class="text-[10px] bg-gray-800 text-gray-400 px-1.5 py-0.2 rounded font-mono tab-count" id="count-services">0</span>
            </a>

            <a href="#" data-folder="investors" data-title="Quan hệ đầu tư" class="nav-tab flex items-center justify-between px-3 py-2 rounded-lg text-gray-400 hover:bg-[#1a1d26] hover:text-gray-200 transition">
              <div class="flex items-center gap-2.5">
                <i data-lucide="trending-up" class="w-4 h-4"></i>
                <span>Quan hệ đầu tư</span>
              </div>
              <span class="text-[10px] bg-gray-800 text-gray-400 px-1.5 py-0.2 rounded font-mono tab-count" id="count-investors">0</span>
            </a>

            <a href="#" data-folder="hr" data-title="Chính sách nhân sự" class="nav-tab flex items-center justify-between px-3 py-2 rounded-lg text-gray-400 hover:bg-[#1a1d26] hover:text-gray-200 transition">
              <div class="flex items-center gap-2.5">
                <i data-lucide="users" class="w-4 h-4"></i>
                <span>Chính sách nhân sự</span>
              </div>
              <span class="text-[10px] bg-gray-800 text-gray-400 px-1.5 py-0.2 rounded font-mono tab-count" id="count-hr">0</span>
            </a>

          </nav>
        </div>

        <!-- SECTION 2: DANH SÁCH BÀI VIẾT THUỘC TAB ĐANG CHỌN -->
        <div class="p-3 border-b border-[#222630] flex items-center justify-between bg-[#0f1117]">
          <span class="text-xs font-semibold text-gray-300 uppercase tracking-wider flex items-center gap-1.5">
            <i data-lucide="list" class="w-3.5 h-3.5 text-rose-500"></i>
            Bài viết: <span id="current-tab-label" class="text-rose-400">Tin tức</span>
          </span>
          <button id="btn-clear-tab" title="Xóa danh sách Tab này" class="text-gray-500 hover:text-rose-400 text-[11px] transition">
            Xóa tab
          </button>
        </div>

        <!-- CONTAINER CHỨA LIST BÀI VIẾT -->
        <div id="posts-list-container" class="flex-1 overflow-y-auto p-2 space-y-1.5">
          <!-- Item bài viết render ở đây -->
        </div>
      </aside>

      <!-- CỘT 2: FORM NHẬP LIỆU -->
      <main class="flex-1 flex flex-col bg-[#14171f] overflow-hidden border-r border-[#222630]">
        
        <!-- Form Header & Action Bar -->
        <div class="h-12 border-b border-[#222630] px-6 flex items-center justify-between bg-[#12141c] shrink-0">
          <div class="flex items-center gap-2">
            <i data-lucide="edit-3" class="w-4 h-4 text-rose-500"></i>
            <span id="form-title" class="font-semibold text-gray-200">Soạn bài viết cho [Tin tức]</span>
          </div>
          
          <div class="flex items-center gap-2">
            <button id="btn-reset" class="px-3 py-1.5 text-xs text-gray-400 hover:text-white transition font-medium">
              Làm mới form
            </button>

            <!-- NÚT LƯU BÀI VÀO BỘ NHỚ TAB -->
            <button id="btn-add-to-list" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-3 py-1.5 rounded flex items-center gap-1.5 transition shadow-lg shadow-blue-900/20">
              <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i>
              Lưu vào Tab này
            </button>

            <!-- NÚT XUẤT CSV -->
            <button id="btn-export-csv" class="bg-emerald-700 hover:bg-emerald-600 text-white text-xs font-semibold px-3 py-1.5 rounded flex items-center gap-1.5 transition shadow-lg shadow-emerald-900/20">
              <i data-lucide="file-spreadsheet" class="w-3.5 h-3.5"></i>
              Xuất Sheets (.CSV)
            </button>

            <!-- NÚT XUẤT JSON TAB HIỆN TẠI -->
            <button id="btn-export-json" class="bg-rose-600 hover:bg-rose-500 text-white text-xs font-semibold px-3 py-1.5 rounded flex items-center gap-1.5 transition shadow-lg shadow-rose-900/20">
              <i data-lucide="download" class="w-3.5 h-3.5"></i>
              Tải file <span id="export-json-filename" class="font-mono ml-0.5">posts-news.json</span>
            </button>
          </div>
        </div>

        <!-- Form Inputs Area -->
        <div class="flex-1 overflow-y-auto p-6 space-y-5">
          
          <!-- Hàng 1: ID & Ngày đăng -->
          <div class="grid grid-cols-2 gap-4">
            <div class="space-y-1.5">
              <label class="block text-xs font-semibold text-gray-300">Mã ID (<code class="text-rose-400">id</code>)</label>
              <input type="number" id="input-id" value="1" 
                class="w-full bg-[#0f1117] border border-[#2a2e3d] focus:border-rose-500 rounded-lg px-3.5 py-2 text-gray-100 font-mono text-xs outline-none">
            </div>
            <div class="space-y-1.5">
              <label class="block text-xs font-semibold text-gray-300">Ngày đăng (<code class="text-rose-400">date</code>)</label>
              <input type="text" id="input-date" placeholder="DD/MM/YYYY" 
                class="w-full bg-[#0f1117] border border-[#2a2e3d] focus:border-rose-500 rounded-lg px-3.5 py-2 text-gray-100 font-mono text-xs outline-none">
            </div>
          </div>

          <!-- Hàng 2: SELECT CATEGORY & CATEGORY LABEL -->
          <div class="grid grid-cols-2 gap-4">
            <div class="space-y-1.5">
              <label class="block text-xs font-semibold text-gray-300">Phân loại (<code class="text-rose-400">category</code>)</label>
              <select id="select-category" class="w-full bg-[#0f1117] border border-[#2a2e3d] focus:border-rose-500 rounded-lg px-3 py-2 text-gray-100 text-xs outline-none cursor-pointer">
                <option value="cong-ty" data-label="TIN TỨC">cong-ty (Công ty)</option>
                <option value="chuyen-gia" data-label="CHUYÊN GIA">chuyen-gia (Chuyên gia)</option>
                <option value="thi-truong" data-label="THỊ TRƯỜNG">thi-truong (Thị trường)</option>
                <option value="phap-luat" data-label="PHÁP LUẬT">phap-luat (Pháp luật)</option>
                <option value="khach-hang-bao-chi" data-label="BÁO CHÍ">khach-hang-bao-chi (Khách hàng & Báo chí)</option>
              </select>
            </div>

            <div class="space-y-1.5">
              <label class="block text-xs font-semibold text-gray-300">Nhãn Hiển Thị (<code class="text-rose-400">categoryLabel</code>)</label>
              <input type="text" id="input-category-label" value="TIN TỨC" 
                class="w-full bg-[#0f1117] border border-[#2a2e3d] focus:border-rose-500 rounded-lg px-3.5 py-2 text-gray-300 font-mono text-xs outline-none">
            </div>
          </div>

          <!-- Tiêu đề (title) -->
          <div class="space-y-1.5">
            <label class="block text-xs font-semibold text-gray-300">
              Tiêu đề bài viết (<code class="text-rose-400">title</code>) <span class="text-rose-500">*</span>
            </label>
            <input type="text" id="input-title" placeholder="VD: PV INCONS Chuẩn Hóa Quy Trình Báo Cáo Tài Chính" 
              class="w-full bg-[#0f1117] border border-[#2a2e3d] focus:border-rose-500 focus:ring-1 focus:ring-rose-500 rounded-lg px-3.5 py-2 text-gray-100 placeholder-gray-600 outline-none transition text-sm">
          </div>

          <!-- Mô tả tóm tắt (summary) -->
          <div class="space-y-1.5">
            <label class="block text-xs font-semibold text-gray-300">Mô tả tóm tắt (<code class="text-rose-400">summary</code>)</label>
            <textarea id="input-summary" rows="2" placeholder="VD: Đảm bảo tính pháp lý minh bạch cho các dự án." 
              class="w-full bg-[#0f1117] border border-[#2a2e3d] focus:border-rose-500 rounded-lg p-3 text-gray-100 placeholder-gray-600 outline-none transition text-sm"></textarea>
          </div>

          <!-- Đường dẫn Hình ảnh (image) -->
          <div class="space-y-1.5">
            <label class="block text-xs font-semibold text-gray-300">Đường dẫn Hình ảnh (<code class="text-rose-400">image</code>)</label>
            <input type="text" id="input-image" placeholder="https://i.pinimg.com/1200x/..." 
              class="w-full bg-[#0f1117] border border-[#2a2e3d] focus:border-rose-500 rounded-lg px-3.5 py-2 text-gray-100 placeholder-gray-600 outline-none transition text-xs font-mono">
          </div>

          <!-- Đường dẫn Bài viết (link) -->
          <div class="space-y-1.5">
            <label class="block text-xs font-semibold text-gray-300">Đường dẫn file HTML chi tiết (<code class="text-rose-400">link</code>)</label>
            <input type="text" id="input-link" placeholder="content/news/news_001.html" 
              class="w-full bg-[#0f1117] border border-[#2a2e3d] focus:border-rose-500 rounded-lg px-3.5 py-2 text-gray-100 placeholder-gray-600 outline-none transition text-xs font-mono">
          </div>

        </div>
      </main>

      <!-- CỘT 3: LIVE JSON PREVIEW THUỘC TAB HIỆN TẠI -->
      <aside class="w-96 bg-[#0c0d12] flex flex-col shrink-0">
        <div class="h-12 border-b border-[#222630] px-4 flex items-center justify-between bg-[#12141c]">
          <div class="flex items-center gap-2 text-xs font-semibold text-gray-300 font-mono">
            <i data-lucide="code-2" class="w-4 h-4 text-emerald-400"></i>
            <span id="json-header-filename">posts-news.json</span>
          </div>
          <button id="btn-copy" class="text-[11px] text-rose-400 hover:underline flex items-center gap-1 font-mono">
            <i data-lucide="copy" class="w-3 h-3"></i> Copy
          </button>
        </div>

        <div class="flex-1 p-4 overflow-y-auto font-mono text-xs">
          <pre id="json-output" class="text-emerald-400 leading-relaxed whitespace-pre-wrap break-all bg-[#08090c] p-4 rounded-lg border border-[#1e222d]">[]</pre>
        </div>

        <div class="p-3 border-t border-[#222630] bg-[#12141c] text-[11px] text-gray-500 flex justify-between items-center font-mono">
          <span>Auto-Saved LocalStorage</span>
          <span class="text-emerald-500">Mảng JSON Tab Hiện Tại</span>
        </div>
      </aside>

    </div>
  </div>

  <!-- JAVASCRIPT XỬ LÝ QUẢN LÝ THEO TAB CHA -->
  <script>
    lucide.createIcons();

    // Dữ liệu tổng lưu trong LocalStorage dạng Object: { news: [...], projects: [...], services: [...], investors: [...], hr: [...] }
    let db = JSON.parse(localStorage.getItem('pv_studio_db')) || {
      news: [],
      projects: [],
      services: [],
      investors: [],
      hr: []
    };

    // Tab hiện tại (Mặc định là 'news')
    let currentFolder = "news";
    let currentTitle = "Tin tức";

    function getTodayFormatted() {
      const today = new Date();
      const dd = String(today.getDate()).padStart(2, '0');
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const yyyy = today.getFullYear();
      return `${dd}/${mm}/${yyyy}`;
    }

    // Elements
    const inputId = document.getElementById('input-id');
    const selectCategory = document.getElementById('select-category');
    const inputCategoryLabel = document.getElementById('input-category-label');
    const inputTitle = document.getElementById('input-title');
    const inputSummary = document.getElementById('input-summary');
    const inputDate = document.getElementById('input-date');
    const inputImage = document.getElementById('input-image');
    const inputLink = document.getElementById('input-link');
    const jsonOutput = document.getElementById('json-output');
    const postsListContainer = document.getElementById('posts-list-container');
    
    const formTitle = document.getElementById('form-title');
    const currentTabLabel = document.getElementById('current-tab-label');
    const activeModuleBadge = document.getElementById('active-module-badge');
    const exportJsonFilename = document.getElementById('export-json-filename');
    const jsonHeaderFilename = document.getElementById('json-header-filename');

    inputDate.value = getTodayFormatted();

    // Tự đổi categoryLabel khi chọn dropdown
    selectCategory.addEventListener('change', (e) => {
      const selectedOption = e.target.options[e.target.selectedIndex];
      inputCategoryLabel.value = selectedOption.getAttribute('data-label');
    });

    // Cập nhật số lượng đếm trên Sidebar Tabs
    function updateTabCounts() {
      ['news', 'projects', 'services', 'investors', 'hr'].forEach(folder => {
        const countEl = document.getElementById(`count-${folder}`);
        if (countEl) countEl.innerText = (db[folder] || []).length;
      });
    }

    // Render danh sách bài viết thuộc Tab hiện tại
    function renderPostsList() {
      updateTabCounts();
      const currentList = db[currentFolder] || [];
      
      // Hiển thị JSON Preview của riêng Tab này
      jsonOutput.textContent = JSON.stringify(currentList, null, 2);
      
      // Lưu toàn bộ vào LocalStorage
      localStorage.setItem('pv_studio_db', JSON.stringify(db));

      if (currentList.length === 0) {
        postsListContainer.innerHTML = `<div class="p-4 text-center text-xs text-gray-600">Chưa có bài viết nào trong Tab <strong>${currentTitle}</strong>.</div>`;
        return;
      }

      postsListContainer.innerHTML = '';
      currentList.forEach((post, index) => {
        const item = document.createElement('div');
        item.className = "bg-[#181b24] p-2.5 rounded-lg border border-[#282c38] hover:border-rose-500/50 transition flex items-start justify-between gap-2 group cursor-pointer";
        item.innerHTML = `
          <div class="flex-1 overflow-hidden" onclick="editPost(${index})">
            <div class="flex items-center gap-1.5 text-[10px] text-gray-400 font-mono mb-1">
              <span class="bg-rose-500/10 text-rose-400 px-1.5 py-0.2 rounded font-bold">#${post.id}</span>
              <span>${post.date}</span>
            </div>
            <div class="text-xs font-semibold text-gray-200 truncate group-hover:text-rose-400 transition">${post.title || 'Bài chưa có tiêu đề'}</div>
          </div>
          <button onclick="deletePost(${index})" class="text-gray-500 hover:text-rose-500 p-1 rounded transition">
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
          </button>
        `;
        postsListContainer.appendChild(item);
      });
      lucide.createIcons();
    }

    // Tự động gợi ý ID tiếp theo cho Tab
    function getNextId() {
      const currentList = db[currentFolder] || [];
      if (currentList.length === 0) return 1;
      const maxId = Math.max(...currentList.map(p => parseInt(p.id) || 0));
      return maxId + 1;
    }

    // Cập nhật lại Form theo Tab đang chọn
    function setTabContext(folder, title) {
      currentFolder = folder;
      currentTitle = title;

      const fileName = `posts-${currentFolder}.json`;
      activeModuleBadge.innerText = `${fileName} Active`;
      exportJsonFilename.innerText = fileName;
      jsonHeaderFilename.innerText = fileName;
      formTitle.innerText = `Soạn bài viết cho [${currentTitle}]`;
      currentTabLabel.innerText = currentTitle;

      // Reset ID & Link chuẩn theo Folder
      const nextId = getNextId();
      inputId.value = nextId;
      const padId = String(nextId).padStart(3, '0');
      inputLink.value = `content/${currentFolder}/${currentFolder}_${padId}.html`;

      renderPostsList();
    }

    // SỰ KIỆN CLICK CHUYỂN TAB CHA
    const navTabs = document.querySelectorAll('.nav-tab');
    navTabs.forEach(tab => {
      tab.addEventListener('click', (e) => {
        e.preventDefault();
        
        // Active Style
        navTabs.forEach(t => {
          t.className = "nav-tab flex items-center justify-between px-3 py-2 rounded-lg text-gray-400 hover:bg-[#1a1d26] hover:text-gray-200 transition";
          const icon = t.querySelector('i');
          if (icon) icon.classList.remove('text-rose-500');
        });

        tab.className = "nav-tab active flex items-center justify-between px-3 py-2 rounded-lg bg-rose-600/10 text-rose-400 font-medium border border-rose-500/20 transition";
        const currentIcon = tab.querySelector('i');
        if (currentIcon) currentIcon.classList.add('text-rose-500');

        const folder = tab.getAttribute('data-folder');
        const title = tab.getAttribute('data-title');
        
        setTabContext(folder, title);
      });
    });

    // Lấy dữ liệu từ Form
    function getFormData() {
      return {
        id: parseInt(inputId.value) || 1,
        category: selectCategory.value || "cong-ty",
        categoryLabel: inputCategoryLabel.value || "TIN TỨC",
        title: inputTitle.value || "",
        summary: inputSummary.value || "",
        date: inputDate.value || getTodayFormatted(),
        image: inputImage.value || "",
        link: inputLink.value || ""
      };
    }

    // LƯU BÀI VÀO TAB HIỆN TẠI
    document.getElementById('btn-add-to-list').addEventListener('click', () => {
      const currentData = getFormData();
      if (!currentData.title) return alert('Vui lòng nhập tiêu đề bài viết!');

      if (!db[currentFolder]) db[currentFolder] = [];

      // Kiểm tra trùng ID trong Tab hiện tại
      const existingIndex = db[currentFolder].findIndex(p => p.id === currentData.id);
      if (existingIndex !== -1) {
        db[currentFolder][existingIndex] = currentData; // Cập nhật
      } else {
        db[currentFolder].push(currentData); // Thêm mới
      }

      // Tự nhảy ID lên +1
      const nextId = getNextId();
      inputId.value = nextId;
      const padId = String(nextId).padStart(3, '0');
      inputLink.value = `content/${currentFolder}/${currentFolder}_${padId}.html`;
      inputTitle.value = '';
      inputSummary.value = '';
      inputImage.value = '';

      renderPostsList();
    });

    // Sửa bài viết khi click vào Item trong list
    window.editPost = function(index) {
      const post = db[currentFolder][index];
      inputId.value = post.id;
      selectCategory.value = post.category;
      inputCategoryLabel.value = post.categoryLabel;
      inputTitle.value = post.title;
      inputSummary.value = post.summary;
      inputDate.value = post.date;
      inputImage.value = post.image;
      inputLink.value = post.link;
    };

    // Xóa một bài
    window.deletePost = function(index) {
      if (confirm(`Bạn có muốn xóa bài này khỏi Tab [${currentTitle}]?`)) {
        db[currentFolder].splice(index, 1);
        renderPostsList();
      }
    };

    // Xóa danh sách Tab hiện tại
    document.getElementById('btn-clear-tab').addEventListener('click', () => {
      if (confirm(`Xóa toàn bộ bài viết trong Tab [${currentTitle}]?`)) {
        db[currentFolder] = [];
        renderPostsList();
      }
    });

    // Reset Form
    document.getElementById('btn-reset').addEventListener('click', () => {
      inputTitle.value = '';
      inputSummary.value = '';
      inputImage.value = '';
      inputDate.value = getTodayFormatted();
    });

    // Nạp dữ liệu từ File JSON cũ vào đúng Tab đang chọn
    document.getElementById('file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const importedData = JSON.parse(evt.target.result);
          if (Array.isArray(importedData)) {
            db[currentFolder] = importedData;
            renderPostsList();
            alert(`✅ Đã nạp ${importedData.length} bài viết vào Tab [${currentTitle}] thành công!`);
          } else {
            alert('❌ File JSON không đúng định dạng Mảng (Array)');
          }
        } catch (err) {
          alert('❌ Đọc file lỗi: Không đúng định dạng JSON!');
        }
      };
      reader.readAsText(file);
    });

    // Copy JSON Mảng
    document.getElementById('btn-copy').addEventListener('click', () => {
      navigator.clipboard.writeText(jsonOutput.textContent);
      alert(`📋 Đã sao chép Mảng JSON của Tab [${currentTitle}]!`);
    });

    // Xuất File JSON cho Tab Hiện Tại (posts-news.json / posts-projects.json ...)
    document.getElementById('btn-export-json').addEventListener('click', () => {
      const currentList = db[currentFolder] || [];
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentList, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `posts-${currentFolder}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    });

    // Xuất Google Sheets CSV cho Tab hiện tại
    document.getElementById('btn-export-csv').addEventListener('click', () => {
      const currentList = db[currentFolder] || [];
      if (currentList.length === 0) return alert(`Tab [${currentTitle}] chưa có bài nào để xuất CSV!`);

      const headers = ["id", "category", "categoryLabel", "title", "summary", "date", "image", "link"];
      const rows = currentList.map(item => [
        item.id,
        `"${(item.category || '').replace(/"/g, '""')}"`,
        `"${(item.categoryLabel || '').replace(/"/g, '""')}"`,
        `"${(item.title || '').replace(/"/g, '""')}"`,
        `"${(item.summary || '').replace(/"/g, '""')}"`,
        `"${(item.date || '').replace(/"/g, '""')}"`,
        `"${(item.image || '').replace(/"/g, '""')}"`,
        `"${(item.link || '').replace(/"/g, '""')}"`
      ]);

      const csvContent = "\uFEFF" + headers.join(",") + "\n" + rows.map(r => r.join(",")).join("\n");
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `posts_${currentFolder}_export.csv`);
      document.body.appendChild(link);
      link.click();
      link.remove();
    });

    // Tự cập nhật lại link theo ID khi gõ
    inputId.addEventListener('input', () => {
      const padId = String(inputId.value || 1).padStart(3, '0');
      inputLink.value = `content/${currentFolder}/${currentFolder}_${padId}.html`;
    });

    // Khởi chạy mặc định Tab Tin tức
    setTabContext('news', 'Tin tức');
  </script>
</body>
</html>
