<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kết quả tìm kiếm - PV INCONS</title>
    <!-- Tailwind CSS / FontAwesome (Giữ nguyên các link CSS từ index.html) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800">

    <!-- Include Header -->
    <div id="header-placeholder"></div>

    <!-- KHU VỰC HIỂN THỊ KẾT QUẢ TÌM KIẾM -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 min-h-[60vh]">
        <h1 class="text-2xl font-bold text-slate-900 mb-6 border-b pb-3 border-slate-200">
            Kết quả tìm kiếm
        </h1>

        <!-- Script nhúng Google CSE -->
        <script async src="https://cse.google.com/cse.js?cx=b331ecb7d9fe24487"></script>
        
        <!-- Khung chứa kết quả tự động hiển thị theo từ khóa trên URL (?q=...) -->
        <div class="gcse-searchresults-only"></div>
    </main>

    <!-- Include Footer -->
    <div id="footer-placeholder"></div>

    <!-- Script load Header/Footer (nếu dự án dùng layout.js) -->
    <script src="/js/layout.js"></script>
</body>
</html>
